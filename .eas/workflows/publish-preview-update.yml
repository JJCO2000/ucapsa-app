name: Publish UCAPSA Preview Update

on:
  push:
    branches:
      - feat/calendar-day-focus

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  verify:
    name: Verify release gates
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: npm run verify:release

  publish_preview_update:
    name: Publish Android preview update
    needs: [verify]
    type: update
    environment: preview
    params:
      channel: preview
      platform: android

# Trigger preview for calendar day focus.
