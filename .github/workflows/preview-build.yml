name: UCAPSA preview build

on:
  push:
    branches:
      - feat/calendar-day-focus

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured in GitHub Actions secrets."
            exit 1
          fi
      - run: npm ci
      - name: Start EAS preview build
        run: npx eas-cli@20.3.0 build --platform android --profile preview --non-interactive --no-wait
