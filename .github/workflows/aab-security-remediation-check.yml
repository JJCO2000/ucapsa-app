name: AAB security remediation diagnostic

on:
  push:
    branches:
      - fix/aab-184-security-audit-investigation
    paths:
      - .github/workflows/aab-security-remediation-check.yml
      - packages/decode-uri-component-compat/package.json
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Baseline install
        run: npm ci
      - name: Check whether decoder is already patched
        id: decoder
        run: |
          if node -e 'const p=require("./packages/decode-uri-component-compat/package.json");process.exit(p.dependencies["upstream-decoder"]==="npm:decode-uri-component@0.5.1"?0:1)'; then echo 'needs_patch=false' >> "$GITHUB_OUTPUT"; else echo 'needs_patch=true' >> "$GITHUB_OUTPUT"; fi
      - name: Verify committed decoder patch
        if: steps.decoder.outputs.needs_patch == 'false'
        run: |
          npm run check:dependency-security-overrides
          npm run check:transitive-security
          npm run typecheck
      - name: Capture baseline audit
        shell: bash
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/baseline-audit.json" || true
          node -e 'const r=require(process.env.RUNNER_TEMP+"/baseline-audit.json");console.log(JSON.stringify(r.metadata?.vulnerabilities,null,2));console.log("Advisories",Object.fromEntries(Object.entries(r.vulnerabilities||{}).map(([k,v])=>[k,{severity:v.severity,via:v.via.map(x=>typeof x==="string"?x:{url:x.url,range:x.range}),fixAvailable:v.fixAvailable}])))'
      - name: Test narrowly scoped patched dependencies
        if: steps.decoder.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set 'dependencies.upstream-decoder=npm:decode-uri-component@0.5.1' --prefix packages/decode-uri-component-compat
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci
          # Existing guard pins 0.5.0; test the candidate behavior first without changing the committed policy.
          node -e 'const fs=require("fs");const p="scripts/check-dependency-security-overrides.mjs";let s=fs.readFileSync(p,"utf8").replaceAll("0.5.0","0.5.1");s=s.replace("node_modules/upstream-decoder", "packages/decode-uri-component-compat/node_modules/upstream-decoder");fs.writeFileSync(p,s)'
          node -e 'const l=require("./package-lock.json");console.log("Decoder lock entries:",Object.entries(l.packages).filter(([k])=>k.includes("upstream-decoder")||k.includes("decode-uri-component")).map(([k,v])=>[k,v.version,v.dependencies]))'
          npm run check:dependency-security-overrides
          npm run check:transitive-security
          npm run typecheck
          npm audit --omit=dev --json > "$RUNNER_TEMP/patched-audit.json" || true
          node -e 'const r=require(process.env.RUNNER_TEMP+"/patched-audit.json");console.log(JSON.stringify(r.metadata?.vulnerabilities,null,2))'
          git diff -- package-lock.json packages/decode-uri-component-compat/package.json > "$RUNNER_TEMP/decoder-patch.diff"
          test -s "$RUNNER_TEMP/decoder-patch.diff"
      - name: Commit validated decoder patch to investigation branch
        if: steps.decoder.outputs.needs_patch == 'true' && success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/decode-uri-component-compat/package.json package-lock.json scripts/check-dependency-security-overrides.mjs
          git diff --cached --check
          git commit -m 'fix: patch URI decoder and align dependency security guard'
          git push origin HEAD:fix/aab-184-security-audit-investigation
      - name: Upload diagnostics and candidate patch
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aab-184-security-diagnostics
          path: |
            ${{ runner.temp }}/baseline-audit.json
            ${{ runner.temp }}/patched-audit.json
            ${{ runner.temp }}/decoder-patch.diff
          if-no-files-found: warn
