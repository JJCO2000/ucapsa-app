name: Publish Preview OTA

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Mensaje del EAS Update"
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: ucap-preview-ota
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish Preview OTA
    if: >
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       github.actor == 'JJCO2000') ||
      (github.event_name == 'issue_comment' &&
       github.event.action == 'created' &&
       github.event.issue.number == 28 &&
       github.event.comment.user.login == 'JJCO2000' &&
       github.actor == 'JJCO2000' &&
       github.event.comment.body == '/publish-preview')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: preview

    steps:
      - name: Require EXPO_TOKEN
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN no esta configurado en el environment preview."
            exit 1
          fi

      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # v9.0.1
        with:
          eas-version: 20.3.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Release gates
        run: npm run verify:release

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Critical vulnerability gate
        run: npm run audit:critical

      - name: Publish Android Preview OTA
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_MESSAGE: ${{ inputs.message }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            UPDATE_MESSAGE="$MANUAL_MESSAGE"
          else
            SHORT_SHA="$(git rev-parse --short HEAD)"
            UPDATE_MESSAGE="UCAPSA Preview OTA ${SHORT_SHA}"
          fi
          eas update --channel preview --platform android --message "$UPDATE_MESSAGE" --environment preview --non-interactive
