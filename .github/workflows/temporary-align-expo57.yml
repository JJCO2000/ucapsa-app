name: Temporary Expo SDK 57 patch alignment
on:
  push:
    branches:
      - fix/expo57-doctor-patch-align

permissions:
  contents: write

concurrency:
  group: expo57-patch-align
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/expo57-doctor-patch-align
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Align Expo SDK 57 compatible patches and lockfile
        run: npx expo install --fix --npm
      - name: Verify Expo compatibility
        run: npx expo-doctor
      - name: Run UCAPSA release quality gates
        run: npm run verify:release
      - name: Commit patch alignment only
        shell: bash
        run: |
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes needed."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "fix(expo): align SDK 57 patch dependencies and lockfile"
          git push origin HEAD:fix/expo57-doctor-patch-align
