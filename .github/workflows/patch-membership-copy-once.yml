name: One-shot lifetime membership copy cleanup

on:
  push:
    branches:
      - feature/lifetime-membership-progression

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/lifetime-membership-progression
          persist-credentials: true

      - name: Apply exact copy replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          programs = Path('src/services/programs.service.ts')
          text = programs.read_text()
          replacements = {
              "{ value: 'medio', label: 'Medio' },": "{ value: 'medio', label: 'Intermedio' },",
              "if (level === 'medio') return 'Medio';": "if (level === 'medio') return 'Intermedio';",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected programs.service.ts text: {old}')
              text = text.replace(old, new, 1)
          programs.write_text(text)

          membership = Path('src/app/client/membership.tsx')
          text = membership.read_text()
          old = "subtitle={premium ? 'Tu credencial, vigencia y acceso como socio.' : 'Estado, vigencia y credencial.'}"
          new = "subtitle={premium ? 'Tu credencial y acceso como socio.' : 'Estado y credencial.'}"
          if old not in text:
              raise SystemExit('Missing expected membership subtitle')
          membership.write_text(text.replace(old, new, 1))

          Path('.github/workflows/patch-membership-copy-once.yml').unlink()
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/programs.service.ts src/app/client/membership.tsx .github/workflows/patch-membership-copy-once.yml
          git commit -m 'copy: use Intermedio and remove membership vigencia wording'
          git push origin HEAD:feature/lifetime-membership-progression
