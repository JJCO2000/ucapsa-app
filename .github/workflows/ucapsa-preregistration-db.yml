name: UCAPSA isolated PostgreSQL integration

on:
  pull_request:
    paths:
      - 'supabase/migrations/20261018195000_admin_dog_preregistration.sql'
      - 'supabase/migrations/20261018210000_staged_program_attendance_evidence.sql'
      - 'supabase/migrations/20261018220000_link_preregistered_history.sql'
      - 'supabase/migrations/20261018230000_staff_preregistered_roster.sql'
      - 'supabase/migrations/20261019080000_preregistration_historical_training_decisions.sql'
      - 'supabase/migrations/20261019170000_admin_preregistration_records.sql'
      - 'supabase/migrations/20261019183000_preregistration_primary_email.sql'
      - 'supabase/migrations/20261019193000_verified_phone_preregistration_claim.sql'
      - 'supabase/migrations/20261019220000_private_preregistration_link_preview.sql'
      - 'supabase/migrations/20261019233000_admin_approved_preregistration_owner_link.sql'
      - 'supabase/migrations/20261019235000_first_trusted_auto_prereg_link.sql'
      - 'supabase/migrations/20261020000000_first_contact_claim_lock.sql'
      - 'supabase/migrations/20261020001000_preregistration_second_claim_requests.sql'
      - 'supabase/migrations/20261020002000_admin_approved_competing_link_transfer.sql'
      - 'supabase/migrations/20261020045901_admin_complete_preregistration_contact.sql'
      - 'supabase/migrations/20261020060000_preregistered_membership_authorization.sql'
      - 'supabase/migrations/20261021110000_staff_preregistration_entry.sql'
      - 'supabase/migrations/20261023040000_preregistration_family_capture.sql'
      - 'supabase/migrations/20261023053000_require_family_contact.sql'
      - 'scripts/isolated-db/**'
      - '.github/workflows/ucapsa-preregistration-db.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_only_ucapsa_test
          POSTGRES_DB: ucapsa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ucapsa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: local_only_ucapsa_test
      PGDATABASE: ucapsa_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify PostgreSQL client
        run: psql --version
      - name: Initialize isolated fixture
        run: psql -X --set ON_ERROR_STOP=on -f scripts/isolated-db/ucapsa-fixture.sql
      - name: Apply preregistration migrations IN ORDER
        run: |
          psql -X --set ON_ERROR_STOP=on -f supabase/migrations/20261018195000_admin_dog_preregistration.sql
          psql -X --set ON_ERROR_STOP=on -f supabase/migrations/20261018210000_staged_program_attendance_evidence.sql
          psql -X --set ON_ERROR_STOP=on -f supabase/migrations/20261018220000_link_preregistered_history.sql
          psql -X --set ON_ERROR_STOP=on -f supabase/migrations/20261018230000_staff_preregistered_roster.sql
          psql -X --set ON_ERROR_STOP=on -f supabase/migrations/20261019080000_preregistration_historical_training_decisions.sql
          psql -X --set ON_ERROR_STOP=on -f supabase/migrations/20261019170000_admin_preregistration_records.sql
          psql -X --set ON_ERROR_STOP=on -f supabase/migrations/20261019183000_preregistration_primary_email.sql
          psql -X --set ON_ERROR_STOP=on -f supabase/migrations/20261019193000_verified_phone_preregistration_claim.sql
          psql -X --set ON_ERROR_STOP=on -f supabase/migrations/20261019220000_private_preregistration_link_preview.sql
          psql -X --set ON_ERROR_STOP=on -f supabase/migrations/20261019233000_admin_approved_preregistration_owner_link.sql
          psql -X --set ON_ERROR_STOP=on -f supabase/migrations/20261019235000_first_trusted_auto_prereg_link.sql
          psql -X --set ON_ERROR_STOP=on -f supabase/migrations/20261020000000_first_contact_claim_lock.sql
          psql -X --set ON_ERROR_STOP=on -f supabase/migrations/20261020001000_preregistration_second_claim_requests.sql
          psql -X --set ON_ERROR_STOP=on -f supabase/migrations/20261020002000_admin_approved_competing_link_transfer.sql
          psql -X --set ON_ERROR_STOP=on -f supabase/migrations/20261020045901_admin_complete_preregistration_contact.sql
      - name: Exercise permissions, identity, enrollments and attendance
        run: psql -X --set ON_ERROR_STOP=on -f scripts/isolated-db/ucapsa-e2e.sql
      - name: Verify Admin-only directory from seeded historical data
        run: psql -X --set ON_ERROR_STOP=on -f scripts/isolated-db/ucapsa-preregistration-directory-e2e.sql
      - name: Competing admins do not duplicate records
        run: bash scripts/isolated-db/ucapsa-concurrency.sh
      - name: Prove Admin-only manual linking, no verified contacts or paid SMS
        run: psql -X --set ON_ERROR_STOP=on -f scripts/isolated-db/ucapsa-admin-approved-link-e2e.sql
      - name: Reject repeated auto-link and require Admin plus user acceptance
        run: psql -X --set ON_ERROR_STOP=on -f scripts/isolated-db/ucapsa-first-auto-link-e2e.sql
      - name: First matching account wins without SMS; later account generates Admin request
        run: psql -X --set ON_ERROR_STOP=on -f scripts/isolated-db/ucapsa-first-contact-no-otp-e2e.sql
      - name: Late phone entry after email signup matches as existing first-claim flow
        run: psql -X --set ON_ERROR_STOP=on -f scripts/isolated-db/ucapsa-late-phone-first-match-e2e.sql
      - name: Admin may only complete missing contacts without touching historical program data
        run: psql -X --set ON_ERROR_STOP=on -f scripts/isolated-db/ucapsa-admin-complete-contact-e2e.sql
      - name: Install canonical Socio fixture and preapproved membership migration
        run: |
          psql -X --set ON_ERROR_STOP=on -f scripts/isolated-db/ucapsa-member-lifecycle-fixture.sql
          psql -X --set ON_ERROR_STOP=on -f supabase/migrations/20261020060000_preregistered_membership_authorization.sql
      - name: Test Socio authorization with Comandos and Puppy history
        run: psql -X --set ON_ERROR_STOP=on -f scripts/isolated-db/ucapsa-preregistered-membership-e2e.sql
      - name: Install trainer wrapper and private family staging
        run: |
          psql -X --set ON_ERROR_STOP=on -f supabase/migrations/20261021110000_staff_preregistration_entry.sql
          psql -X --set ON_ERROR_STOP=on -f supabase/migrations/20261023040000_preregistration_family_capture.sql
          psql -X --set ON_ERROR_STOP=on -f supabase/migrations/20261023053000_require_family_contact.sql
      - name: Verify family staging, Admin/Trainer permissions and no claim leakage
        run: psql -X --set ON_ERROR_STOP=on -f scripts/isolated-db/ucapsa-family-preregistration-e2e.sql
