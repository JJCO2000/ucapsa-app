name: Build Android Production AAB

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: ucap-production-aab
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build Android Production AAB
    if: >
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       github.actor == 'JJCO2000') ||
      (github.event_name == 'issue_comment' &&
       github.event.action == 'created' &&
       github.event.issue.number == 260 &&
       github.event.comment.user.login == 'JJCO2000' &&
       github.actor == 'JJCO2000' &&
       github.event.comment.body == '/build-production-aab')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: production

    steps:
      - name: Require EXPO_TOKEN
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN no esta configurado para el build Production."
            exit 1
          fi

      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 20.3.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Release gates
        run: npm run verify:release

      # Same pinned, reproducible SDK 57 validation already proven in quality.yml.
      # The Expo remote patch catalogue can advance independently of this lockfile.
      # Verify exact native dependency versions before skipping only Doctor's remote check.
      - name: Validate Expo SDK dependency baseline
        run: node scripts/check-expo-validated-deps.mjs

      - name: Expo Doctor
        run: EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK=1 npx --yes expo-doctor@1.20.4

      - name: Critical vulnerability gate
        run: npm run audit:critical

      # EAS autoIncrement alone can lag an already-used Google Play versionCode.
      # Keep remote as SSOT, but align its minimum using GitHub run number first.
      # No Play submission is performed by this workflow.
      - name: Ensure unique Android versionCode in EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: node scripts/ensure-production-aab-version.mjs

      - name: Build Android Production AAB
        run: eas build --platform android --profile production --non-interactive --wait

      # A green EAS build does not by itself prove Play accepts its versionCode.
      - name: Verify generated AAB versionCode and commit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          export BUILD_SOURCE_SHA="$(git rev-parse HEAD)"
          eas build:list --platform android --build-profile production --status finished --limit 10 --json --non-interactive > "$RUNNER_TEMP/ucapsa-eas-aab-builds.json"
          node scripts/verify-production-aab-version.mjs "$RUNNER_TEMP/ucapsa-eas-aab-builds.json"
