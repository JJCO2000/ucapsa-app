name: Build Android Production AAB

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: ucap-production-aab
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build Android Production AAB
    if: >
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       github.actor == 'JJCO2000') ||
      (github.event_name == 'issue_comment' &&
       github.event.action == 'created' &&
       github.event.issue.number == 260 &&
       github.event.comment.user.login == 'JJCO2000' &&
       github.actor == 'JJCO2000' &&
       github.event.comment.body == '/build-production-aab')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production

    steps:
      - name: Require EXPO_TOKEN
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN no esta configurado para el build Production."
            exit 1
          fi

      - name: Checkout canonical main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 20.3.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Release gates
        run: npm run verify:release

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Critical vulnerability gate
        run: npm run audit:critical

      - name: Build Android Production AAB
        run: eas build --platform android --profile production --non-interactive --wait
