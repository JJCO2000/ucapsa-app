name: Controlled npm audit fix

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
    paths:
      - .github/workflows/audit-fix-bootstrap.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'security/post-eas-hardening' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout security branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install exact baseline
        run: npm ci

      - name: Apply only non-forced npm audit fixes
        shell: bash
        run: |
          # npm audit fix exits non-zero when vulnerabilities remain even after
          # applying all non-breaking fixes. The explicit audit gate below
          # decides whether the resulting tree is acceptable.
          npm audit fix || true

      - name: Reject unexpected file changes
        shell: bash
        run: |
          unexpected="$(git diff --name-only | grep -Ev '^(package.json|package-lock.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "npm audit fix modifico archivos inesperados:"
            echo "$unexpected"
            exit 1
          fi

      - name: Release gates
        run: npm run verify:release

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Measure remaining production audit findings
        shell: bash
        run: |
          npm audit --omit=dev --json > audit-after.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const audit = JSON.parse(fs.readFileSync('audit-after.json', 'utf8'));
          const v = audit.metadata?.vulnerabilities ?? {};
          console.log(`AUDIT AFTER: critical=${v.critical ?? 0}, high=${v.high ?? 0}, moderate=${v.moderate ?? 0}, low=${v.low ?? 0}`);
          if ((v.critical ?? 0) > 0) process.exit(1);
          if ((v.high ?? 0) > 6) {
            console.error('El arreglo no conserva la reduccion esperada de vulnerabilidades altas; se rechaza.');
            process.exit(1);
          }
          NODE
          rm audit-after.json

      - name: Android export smoke test
        run: npx expo export --platform android --output-dir dist-security --clear

      - name: Commit safe dependency fixes and remove bootstrap
        shell: bash
        run: |
          rm .github/workflows/audit-fix-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/audit-fix-bootstrap.yml
          git commit -m "security: apply non-breaking npm audit fixes"
          git push origin HEAD:${{ github.head_ref }}
