name: Bootstrap EAS Update dependency

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
    paths:
      - .github/workflows/bootstrap-eas-update.yml

permissions:
  contents: write

jobs:
  install:
    if: github.head_ref == 'chore/eas-update-preview' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Install SDK-compatible expo-updates
        run: npx expo install expo-updates

      - name: Align Expo SDK 57 package versions
        run: npx expo install --fix

      - name: Reject unexpected installer changes
        shell: bash
        run: |
          unexpected="$(git diff --name-only | grep -Ev '^(package.json|package-lock.json|app.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Expo modifico archivos inesperados:"
            echo "$unexpected"
            exit 1
          fi

      - name: Verify app.json change is only an Expo plugin addition
        shell: bash
        run: |
          git diff -- app.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const before = JSON.parse(execFileSync('git', ['show', 'HEAD:app.json'], { encoding: 'utf8' }));
          const after = JSON.parse(fs.readFileSync('app.json', 'utf8'));

          const beforePlugins = before.expo?.plugins ?? [];
          const afterPlugins = after.expo?.plugins ?? [];
          const normalize = (v) => JSON.stringify(v);
          const added = afterPlugins.filter((item) => !beforePlugins.some((old) => normalize(old) === normalize(item)));

          const beforeSans = structuredClone(before);
          const afterSans = structuredClone(after);
          beforeSans.expo.plugins = [];
          afterSans.expo.plugins = [];

          if (JSON.stringify(beforeSans) !== JSON.stringify(afterSans)) {
            console.error('app.json cambio fuera de expo.plugins');
            process.exit(1);
          }
          if (added.length !== 1 || normalize(added[0]) !== '"expo-image"') {
            console.error('Cambio inesperado en plugins:', added);
            process.exit(1);
          }
          console.log('app.json OK: Expo solo agrego el plugin expo-image.');
          NODE

      - name: Release gates
        run: npm run verify:release

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Critical vulnerability gate
        run: npm run audit:critical

      - name: Android export smoke test
        run: npx expo export --platform android --output-dir dist-bootstrap --clear

      - name: Remove bootstrap workflow and commit lockfile
        shell: bash
        run: |
          rm .github/workflows/bootstrap-eas-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json package.json package-lock.json .github/workflows/bootstrap-eas-update.yml
          git commit -m "chore: align SDK 57 and install expo-updates"
          git push origin HEAD:${{ github.head_ref }}
