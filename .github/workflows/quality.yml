name: UCAPSA quality gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:release
      - run: npm run audit:critical
      - run: npx expo config --type introspect --json > /tmp/ucapsa-expo-introspect.json
      - run: npx expo export --platform android --output-dir dist-ci-android --clear
      - run: npx expo export --platform ios --output-dir dist-ci-ios --clear
