name: UCAPSA quality gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:release
      # La demo privada de GitHub debe aislar todas las variables públicas y credenciales reales.
      - run: node scripts/github-web-preview.mjs --self-test
      - run: node scripts/check-play-review-provision.mjs
      # Los paquetes del SDK 57 se verifican contra el lockfile probado en
      # Android/iOS, no contra el catálogo remoto que cambia entre commits.
      - run: node scripts/check-expo-validated-deps.mjs
      # Doctor mantiene sus demás 20 verificaciones; solo se sustituye
      # la versión remota de dependencias por el gate reproducible anterior.
      - run: EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK=1 npx --yes expo-doctor@1.20.4
      - run: npm run audit:critical
      # Known unpatched Expo/Metro high advisories remain visible, but new high
      # or critical exposures must fail CI rather than silently accumulating.
      - run: node scripts/check-known-high-security-advisories.mjs --self-test
      - run: node scripts/check-known-high-security-advisories.mjs
      - run: npx expo config --type introspect --json > /tmp/ucapsa-expo-introspect.json
      - run: npx expo export --platform android --source-maps --output-dir dist-ci-android --clear
      # El bundle Android no debe incluir módulos exclusivos del navegador.
      # Source maps sólo para auditoría local de CI; nunca se distribuyen.
      - run: node scripts/check-web-excluded-from-android-bundle.mjs dist-ci-android
      - run: npx expo export --platform ios --output-dir dist-ci-ios --clear
      # Build exacto de la demo de Codespaces: sin acceso a datos ni login.
      # No se publica ni se abre un Codespace al ejecutar esta comprobación.
      - run: npx expo export --platform web --output-dir dist-ci-web --clear
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ci-web-export.invalid
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-only-no-access-key
          EXPO_PUBLIC_UCAPSA_CODESPACES_DEMO: 'true'
          EXPO_PUBLIC_UCAPSA_REVIEW_BUILD: 'true'
      - run: node scripts/check-github-demo-bundle.mjs dist-ci-web
