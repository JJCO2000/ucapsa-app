name: UCAPSA private Ranking photo consent DB

on:
  pull_request:
    paths:
      - 'supabase/migrations/20261021183000_private_ranking_photo_consent.sql'
      - 'supabase/functions/dog-ranking-photo/**'
      - 'scripts/isolated-db/ucapsa-ranking-photo-consent-e2e.sql'
      - 'scripts/check-ranking-photo-consent-contract.mjs'
      - '.github/workflows/ucapsa-ranking-photo-db.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  photo-consent-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_only_photo_test
          POSTGRES_DB: ucapsa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ucapsa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: local_only_photo_test
      PGDATABASE: ucapsa_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run role, notice, source-change and revocation tests in isolated PostgreSQL
        run: psql -X --set ON_ERROR_STOP=on -f scripts/isolated-db/ucapsa-ranking-photo-consent-e2e.sql
