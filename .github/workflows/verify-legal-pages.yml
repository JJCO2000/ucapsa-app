name: Verify UCAPSA legal Pages

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/check-store-privacy.mjs'
      - '.github/workflows/verify-legal-pages.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/check-store-privacy.mjs'
      - '.github/workflows/verify-legal-pages.yml'

permissions:
  contents: read

jobs:
  build-legal-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile GitHub Pages Jekyll site from docs
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./docs
          destination: ./_site
      - name: Verify public HTML content and links
        shell: bash
        run: |
          test -s _site/index.html
          test -s _site/privacidad/index.html
          test -s _site/eliminar-cuenta/index.html
          test -s _site/assets/legal.css
          grep -q 'Aviso de Privacidad' _site/privacidad/index.html
          grep -q 'Universidad de Crianza y Adiestramiento' _site/privacidad/index.html
          grep -q 'Eliminar cuenta y datos' _site/eliminar-cuenta/index.html
          grep -q 'mailto:ucapsa84@gmail.com' _site/eliminar-cuenta/index.html
          grep -q '/ucapsa-app/eliminar-cuenta/' _site/privacidad/index.html
          grep -q '/ucapsa-app/privacidad/' _site/eliminar-cuenta/index.html
          if grep -R -E '\{%[[:space:]]*include_relative' _site/privacidad/index.html _site/eliminar-cuenta/index.html; then
            echo "ERROR: Jekyll did not render the legal sources."
            exit 1
          fi
          echo "UCAPSA legal Pages: HTML build PASS"
      - name: Check deployed legal URLs from an external runner
        shell: bash
        run: |
          set -euo pipefail
          # Compilation alone cannot prove that the store-facing URLs are online.
          base='https://jjco2000.github.io/ucapsa-app'
          for slug in privacidad eliminar-cuenta; do
            target="$base/$slug/"
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --max-time 15 \
              --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$target")"
            test "$code" = 200 || { echo "ERROR: $slug HTTP $code"; exit 1; }
            grep -Eqi '^content-type:[[:space:]]*text/html' "$headers" || {
              echo "ERROR: $slug did not return HTML"; exit 1;
            }
            if [ "$slug" = privacidad ]; then
              grep -qi 'Aviso de Privacidad' "$body"
              grep -qi 'Universidad de Crianza y Adiestramiento' "$body"
            else
              grep -qi 'Eliminar cuenta y datos' "$body"
              grep -qi 'ucapsa84@gmail.com' "$body"
            fi
            echo "UCAPSA public $slug: HTTP 200, HTML and required text PASS"
            rm -f "$headers" "$body"
          done
      - name: Check deployed legal redirect endpoints (GET HEAD POST)
        shell: bash
        run: |
          set -euo pipefail
          api='https://hrfecmviyiluubymsoeq.supabase.co/functions/v1'
          base='https://jjco2000.github.io/ucapsa-app'
          for entry in 'privacy-policy:privacidad' 'account-deletion-request:eliminar-cuenta'; do
            IFS=':' read -r fn slug <<< "$entry"
            expected="$base/$slug/"
            url="$api/$fn"
            for method in GET HEAD; do
              headers="$(mktemp)"
              status="$(curl --silent --show-error --retry 2 --retry-delay 2 --max-time 20 \
                --request "$method" --dump-header "$headers" --output /dev/null \
                --write-out '%{http_code}' "$url")"
              test "$status" = 302 || { echo "ERROR: $fn $method HTTP $status (expected 302)"; exit 1; }
              actual="$(sed -n -E 's/^[Ll]ocation:[[:space:]]*(.*)\r?$/\1/p' "$headers" | tail -1)"
              test "$actual" = "$expected" || {
                echo "ERROR: $fn $method redirects to $actual (expected $expected)"; exit 1;
              }
              rm -f "$headers"
            done
            status="$(curl --silent --show-error --retry 2 --retry-delay 2 --max-time 20 \
              --request POST --output /dev/null --write-out '%{http_code}' "$url")"
            test "$status" = 405 || { echo "ERROR: $fn POST HTTP $status (expected 405)"; exit 1; }
            echo "UCAPSA deployed $fn: GET/HEAD 302 to HTML, POST 405 PASS"
          done
