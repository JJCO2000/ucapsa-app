name: Build Android Preview APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ucap-preview-build
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build Android Preview APK
    if: github.ref == 'refs/heads/main' && github.actor == 'JJCO2000'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: preview

    steps:
      - name: Require EXPO_TOKEN
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN no esta configurado en el environment preview."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 20.3.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Release gates
        run: npm run verify:release

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Critical vulnerability gate
        run: npm run audit:critical

      - name: Build Android Preview APK
        run: eas build --platform android --profile preview --non-interactive --wait
